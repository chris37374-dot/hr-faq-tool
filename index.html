<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR FAQ 快查</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F7F8FA;
    --surface: #FFFFFF;
    --border: #E8EAF0;
    --border-strong: #D0D4E0;
    --text: #1A1D2E;
    --text-dim: #5A5F7A;
    --text-muted: #9298B0;
    --accent: #3B5BDB;
    --accent-light: #EEF2FF;
    --green: #2F9E44;
    --green-bg: #EBFBEE;
    --amber: #E67700;
    --amber-bg: #FFF9DB;
    --red: #C92A2A;
    --red-bg: #FFF5F5;
    --radius: 8px;
    --radius-sm: 5px;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* ── Header ── */
  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-icon {
    font-size: 18px;
    line-height: 1;
  }

  .header-title {
    font-size: 15px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .header-dot {
    width: 4px; height: 4px;
    background: var(--border-strong);
    border-radius: 50%;
  }

  .header-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  .sync-btn {
    margin-left: auto;
    background: none;
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    transition: all 0.15s;
    font-family: inherit;
  }
  .sync-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .sync-btn.syncing { opacity: 0.5; pointer-events: none; }
  .sync-icon.spin { animation: spin 0.8s linear infinite; display: inline-block; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Main layout ── */
  .main {
    max-width: 800px;
    margin: 0 auto;
    padding: 24px 20px 48px;
  }

  /* ── Search ── */
  .search-wrap {
    position: relative;
    margin-bottom: 16px;
  }

  .search-icon {
    position: absolute;
    left: 13px; top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 15px;
    pointer-events: none;
  }

  #searchInput {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    padding: 11px 36px 11px 38px;
    font-size: 14px;
    color: var(--text);
    outline: none;
    font-family: inherit;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  #searchInput:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(59,91,219,0.08);
  }
  #searchInput::placeholder { color: var(--text-muted); }

  .clear-btn {
    position: absolute;
    right: 10px; top: 50%;
    transform: translateY(-50%);
    background: none; border: none;
    color: var(--text-muted);
    font-size: 16px;
    cursor: pointer;
    display: none;
    padding: 2px 6px;
    border-radius: 3px;
    line-height: 1;
  }
  .clear-btn:hover { color: var(--text); background: var(--bg); }
  .clear-btn.show { display: block; }

  /* ── Filter chips ── */
  .filter-row {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    margin-bottom: 16px;
  }

  .chip {
    background: var(--surface);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 4px 11px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    transition: all 0.12s;
    font-family: inherit;
  }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
    font-weight: 500;
  }

  /* ── Stats ── */
  .stats {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 12px;
    height: 18px;
  }
  .stats b { color: var(--accent); font-weight: 600; }

  /* ── Cards ── */
  .card-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    transition: border-color 0.12s, box-shadow 0.12s;
  }
  .card:hover { border-color: var(--border-strong); box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
  .card.open { border-color: var(--border-strong); }

  .card-head {
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
  }

  .mod-tag {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 3px;
    white-space: nowrap;
  }
  .mod-attendance  { background: #E8F4FD; color: #1971C2; }
  .mod-salary      { background: #FFF0F6; color: #C2255C; }
  .mod-hr          { background: #F3F0FF; color: #6741D9; }
  .mod-system      { background: #E6FCF5; color: #0CA678; }
  .mod-report      { background: #FFF9DB; color: #E67700; }
  .mod-law         { background: #FFF5F5; color: #C92A2A; }
  .mod-sign        { background: #EBF4FF; color: #1C7ED6; }
  .mod-insurance   { background: #FFF4E6; color: #D9480F; }
  .mod-sysrelated  { background: #E8F5E9; color: #2E7D32; }
  .mod-ticket      { background: #FFF8E1; color: #F57F17; }
  .mod-other       { background: #F1F3F5; color: #495057; }

  .card-q {
    flex: 1;
    font-size: 14px;
    font-weight: 500;
    color: var(--text);
    line-height: 1.45;
  }

  .level-tag {
    flex-shrink: 0;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: 3px;
    white-space: nowrap;
  }


  .chevron {
    flex-shrink: 0;
    color: var(--text-muted);
    font-size: 10px;
    transition: transform 0.18s;
  }
  .card.open .chevron { transform: rotate(180deg); }

  /* ── Card body ── */
  .card-body {
    display: none;
    padding: 0 14px 14px;
    border-top: 1px solid var(--border);
  }
  .card.open .card-body { display: block; }

  .escalate-note {
    margin-top: 12px;
    padding: 8px 12px;
    background: var(--red-bg);
    border-left: 3px solid var(--red);
    border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    font-size: 13px;
    color: var(--red);
  }

  .answer-label {
    margin-top: 12px;
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .answer-body {
    font-size: 14px;
    line-height: 1.75;
    color: var(--text-dim);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 10px;
  }

  .kw-tag {
    font-size: 11px;
    color: var(--text-muted);
    background: var(--bg);
    border: 1px solid var(--border);
    padding: 2px 7px;
    border-radius: 3px;
  }

  .copy-btn {
    margin-top: 12px;
    background: var(--bg);
    border: 1px solid var(--border-strong);
    color: var(--text-dim);
    padding: 6px 12px;
    border-radius: var(--radius-sm);
    font-size: 12px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    transition: all 0.12s;
    font-family: inherit;
  }
  .copy-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--accent-light); }
  .copy-btn.copied { border-color: var(--green); color: var(--green); background: var(--green-bg); }

  /* ── States ── */
  .state-box {
    text-align: center;
    padding: 56px 20px;
    color: var(--text-muted);
  }
  .state-icon { font-size: 36px; margin-bottom: 10px; }
  .state-title { font-size: 15px; font-weight: 500; color: var(--text-dim); margin-bottom: 5px; }
  .state-sub { font-size: 13px; line-height: 1.6; }

  mark {
    background: #FFF3BF;
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }
</style>
</head>
<body>

<header>
  <span class="header-icon">📋</span>
  <span class="header-title">HR FAQ 快查</span>
  <div class="header-dot"></div>
  <span class="header-sub">震旦客服技術組</span>
  <button class="sync-btn" id="syncBtn" onclick="loadData()">
    <span class="sync-icon" id="syncIcon">↻</span> 重新載入
  </button>
</header>

<div class="main">
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="searchInput"
      placeholder="搜尋問題、關鍵字，例如：打卡、排班、薪資…"
      autocomplete="off">
    <button class="clear-btn" id="clearBtn" onclick="clearSearch()">✕</button>
  </div>

  <div class="filter-row" id="filterRow">
    <button class="chip active" data-module="all">全部</button>
  </div>

  <div class="stats" id="stats"></div>
  <div class="card-list" id="cardList"></div>
</div>

<script>
const NOTION_TOKEN = '';
const DATABASE_ID  = '37cb673a-8729-8073-a176-cc7c2e09ab5a';
const WORKER_URL   = 'https://notion-proxy.nanobanana5555.workers.dev';

let allData = [];
let activeModule = 'all';

async function queryNotion(body) {
  const res = await fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Notion-Version': '2022-06-28', 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  const data = await res.json();
  if (data.object === 'error') throw new Error(data.message);
  return data;
}

async function fetchAll() {
  let results = [], cursor;
  while (true) {
    const body = { page_size: 100, filter: { property: '狀態', select: { equals: '已發布' } } };
    if (cursor) body.start_cursor = cursor;
    const data = await queryNotion(body);
    results = results.concat(data.results || []);
    if (!data.has_more) break;
    cursor = data.next_cursor;
  }
  if (results.length === 0) {
    // fallback: no filter
    cursor = undefined;
    while (true) {
      const body = { page_size: 100 };
      if (cursor) body.start_cursor = cursor;
      const data = await queryNotion(body);
      results = results.concat(data.results || []);
      if (!data.has_more) break;
      cursor = data.next_cursor;
    }
  }
  return results;
}

function txt(richText) {
  return (richText || []).map(t => t.plain_text).join('');
}

function parse(page) {
  const p = page.properties;
  return {
    id:       page.id,
    question: txt(p['顧客問題']?.title) || txt(p['名稱']?.title) || '',
    answer:   txt(p['解答']?.rich_text) || txt(p['答案']?.rich_text) || '',
    module:   p['功能模組']?.select?.name || '',
    note:     (p['備註']?.rich_text || []).map(t => t.plain_text).join('') || '',
    keywords: (p['關鍵字']?.multi_select || []).map(t => t.name),
    status:   p['狀態']?.select?.name || '',
  };
}

async function loadData() {
  const btn = document.getElementById('syncBtn');
  const icon = document.getElementById('syncIcon');
  btn.classList.add('syncing');
  icon.classList.add('spin');
  showState('loading');
  try {
    const pages = await fetchAll();
    allData = pages.map(parse).filter(r => r.question);
    buildFilters();
    render();
  } catch(e) {
    showState('error', e.message);
  } finally {
    btn.classList.remove('syncing');
    icon.classList.remove('spin');
  }
}

function buildFilters() {
  const mods = [...new Set(allData.map(r => r.module).filter(Boolean))].sort();
  const row = document.getElementById('filterRow');
  row.innerHTML = `<button class="chip active" data-module="all">全部</button>`;
  mods.forEach(m => {
    const b = document.createElement('button');
    b.className = 'chip';
    b.dataset.module = m;
    b.textContent = m;
    row.appendChild(b);
  });
  row.querySelectorAll('.chip').forEach(b => {
    b.addEventListener('click', () => {
      activeModule = b.dataset.module;
      row.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      render();
    });
  });
}

function q() { return document.getElementById('searchInput').value.trim(); }

function matches(r, kw) {
  if (!kw) return true;
  const k = kw.toLowerCase();
  return r.question.toLowerCase().includes(k)
    || r.answer.toLowerCase().includes(k)
    || r.keywords.some(w => w.toLowerCase().includes(k))
    || r.module.toLowerCase().includes(k);
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function hi(text, kw) {
  if (!kw) return esc(text);
  const re = new RegExp(kw.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'), 'gi');
  return esc(text).replace(re, m => `<mark>${m}</mark>`);
}

const MOD_CLASS = {
  '出勤管理': 'mod-attendance',
  '薪資計算': 'mod-salary',
  '人事管理': 'mod-hr',
  '共用設定': 'mod-system',
  '報表輸出': 'mod-report',
  '法規合規': 'mod-law',
  '保險管理': 'mod-insurance',
  '流程簽核': 'mod-sign',
  '系統相關': 'mod-sysrelated',
  '開單相關': 'mod-ticket',
};
function modClass(m) { return MOD_CLASS[m] || 'mod-other'; }



function render() {
  const kw = q();
  const list = allData.filter(r =>
    (activeModule === 'all' || r.module === activeModule) && matches(r, kw)
  );

  document.getElementById('clearBtn').className = kw ? 'clear-btn show' : 'clear-btn';

  const stats = document.getElementById('stats');
  if (allData.length === 0) {
    stats.innerHTML = '';
  } else if (kw || activeModule !== 'all') {
    stats.innerHTML = `找到 <b>${list.length}</b> 筆，共 ${allData.length} 筆`;
  } else {
    stats.innerHTML = `共 <b>${allData.length}</b> 筆`;
  }

  const container = document.getElementById('cardList');

  if (list.length === 0 && allData.length > 0) {
    container.innerHTML = `
      <div class="state-box">
        <div class="state-icon">🔍</div>
        <div class="state-title">找不到符合的結果</div>
        <div class="state-sub">換個關鍵字試試，或切換上方模組篩選</div>
      </div>`;
    return;
  }

  container.innerHTML = list.map((r, i) => `
    <div class="card" id="c${i}">
      <div class="card-head" onclick="toggle(${i})">
        <span class="card-q">${hi(r.question, kw)}</span>
        <span class="mod-tag ${modClass(r.module)}">${esc(r.module || '—')}</span>
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">

        <div class="answer-label">解答</div>
        <div class="answer-body">${hi(r.answer, kw)}</div>
        ${r.note ? `<div class="answer-label" style="margin-top:10px;">備註</div><div class="answer-body" style="font-size:13px;color:var(--text-muted);">${hi(r.note, kw)}</div>` : ''}
        ${r.keywords.length ? `
          <div class="tags-row">${r.keywords.map(w=>`<span class="kw-tag">${esc(w)}</span>`).join('')}</div>` : ''}
        <button class="copy-btn" id="cp${i}" onclick="copy(${i},\`${r.answer.replace(/`/g,'\\`')}\`)">
          📋 複製解答
        </button>
      </div>
    </div>
  `).join('');
}

function toggle(i) {
  document.getElementById(`c${i}`).classList.toggle('open');
}

function copy(i, text) {
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById(`cp${i}`);
    btn.textContent = '✅ 已複製';
    btn.classList.add('copied');
    setTimeout(() => { btn.textContent = '📋 複製解答'; btn.classList.remove('copied'); }, 2000);
  });
}

function clearSearch() {
  document.getElementById('searchInput').value = '';
  render();
}

function showState(type, msg) {
  document.getElementById('stats').innerHTML = '';
  const c = document.getElementById('cardList');
  if (type === 'loading') {
    c.innerHTML = `<div class="state-box"><div class="state-icon">⏳</div><div class="state-title">載入中…</div></div>`;
  } else if (type === 'error') {
    c.innerHTML = `<div class="state-box"><div class="state-icon">⚠️</div><div class="state-title">載入失敗</div><div class="state-sub">${esc(msg||'')}<br><br>請確認 Notion Integration 已授權，然後點「重新載入」</div></div>`;
  }
}

document.getElementById('searchInput').addEventListener('input', render);
document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
